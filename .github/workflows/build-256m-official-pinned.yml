name: Build RAX3000M 256M Firmware (official kernel pinned, single device)
'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: ImmortalWrt 发布 tag
        required: true
        default: v25.12.2
      expected_khash:
        description: 官方内核配置 md5（kmod 兼容串）
        required: true
        default: b5b7729ffbba3ecdd83f339de8fadfb8
      make_release:
        description: 发布 Release（true/false）
        required: true
        default: 'true'
      use_committed_config:
        description: 直接用仓库里的 official-kernel-config/（跳过阶段A 约3h）
        required: true
        default: 'true'
env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  TZ: Asia/Shanghai
jobs:
  seed:
    name: 阶段A：用官方 config 生成「官方内核配置」并校验 hash
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    outputs:
      ok: ${{ steps.probe.outputs.ok }}
    steps:
    - &id001
      name: Checkout 本仓库（拿 diy 脚本）
      uses: actions/checkout@v4
    - &id002
      name: 清理磁盘
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        large-packages: true
    - name: 安装编译依赖
      run: "sudo apt-get update -qq\nsudo apt-get install -y --no-install-recommends \\\n  ack antlr3 asciidoc autoconf automake autopoint binutils bison \\\n  build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler \\\n  fastjar flex gawk gcc-multilib g++-multilib git gnutls-dev gperf \\\n  haveged help2man intltool libncurses-dev libelf-dev libglib2.0-dev \\\n  libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libreadline-dev \\\n  libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz nano \\\n  ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip \\\n  python3-ply python3-docutils python3-pyelftools qemu-utils \\\n  re2c rsync scons squashfs-tools subversion swig texinfo \\\n  uglifyjs unzip vim wget xmlto xxd zlib1g-dev zstd\nsudo timedatectl set-timezone \"$TZ\"\necho \"nproc=$(nproc)\""
    - name: 克隆 tag 并铺官方 config / feeds / DTS 补丁
      run: 'TAG="${{ inputs.release_tag }}"; VER="${TAG#v}"

        git clone $REPO_URL -b "$TAG" --single-branch --depth 1 openwrt

        cd openwrt

        curl -fsSL -o .config "https://downloads.immortalwrt.org/releases/${VER}/targets/mediatek/filogic/config.buildinfo"

        grep -q ''^CONFIG_TARGET_mediatek_filogic=y'' .config || { echo "ERROR: config.buildinfo 不对"; exit 1; }

        if [ -f $GITHUB_WORKSPACE/diy-part1.sh ]; then chmod +x $GITHUB_WORKSPACE/diy-part1.sh; $GITHUB_WORKSPACE/diy-part1.sh; fi

        ./scripts/feeds update -a

        ./scripts/feeds install -a

        if [ -f $GITHUB_WORKSPACE/diy-part2.sh ]; then chmod +x $GITHUB_WORKSPACE/diy-part2.sh; $GITHUB_WORKSPACE/diy-part2.sh; fi

        grep -q ''reg = <0x580000 0xFA80000>;'' target/linux/mediatek/dts/mt7981b-cmcc-rax3000m-nand.dtso || { echo "ERROR: DTS 未改 250.5MB"; exit 1; }

        make defconfig'
    - name: 编 tools + toolchain + 内核（只为拿到官方内核配置）
      run: 'cd openwrt

        make -j$(nproc) tools/compile toolchain/compile 2>&1 | tail -5

        timeout 2400 make -j$(nproc) target/linux/compile 2>&1 | tail -30 || true

        LINDIR=$(ls -d build_dir/target-*/linux-mediatek_filogic/linux-6.12.* 2>/dev/null | head -1)

        echo "LINUX_DIR=$LINDIR"

        ls -l "$LINDIR/.config" "$LINDIR/.config.set" "$LINDIR/.vermagic" 2>/dev/null || true

        mkdir -p /tmp/kcfg

        cp -f "$LINDIR/.config.set" /tmp/kcfg/kernel.config.set

        cp -f "$LINDIR/.config"     /tmp/kcfg/kernel.config

        cp -f "$LINDIR/.vermagic"   /tmp/kcfg/vermagic

        ls -l /tmp/kcfg/'
    - name: 校验官方内核 hash（决定 kmod 兼容性）
      id: probe
      run: "cd openwrt\nmkdir -p /tmp/kcfg 2>/dev/null\nOURS=$(grep '=[ym]' /tmp/kcfg/kernel.config.set | LC_ALL=C sort | md5sum | cut -d' ' -f1)\nVERMAGIC=$(cat /tmp/kcfg/vermagic 2>/dev/null | head -c 64)\nOFFI=\"${{ inputs.expected_khash }}\"\necho \"=== seed hash probe: ours=$OURS  vermagic_file=$VERMAGIC  official=$OFFI ===\"\nif [ \"$OURS\" = \"$OFFI\" ]; then\n  echo \"=== 结论：官方 config 复现出的内核配置 hash 与官方一致 ✅ 该配置可作为「官方内核」钉进单设备编译 ===\"\n  echo \"ok=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"=== 结论：不一致 ❌（那说明还需要别的对齐手段）===\"\n  echo \"ok=false\" >> \"$GITHUB_OUTPUT\"\nfi\necho \"kernel_config_md5=$OURS\" > /tmp/kcfg/INFO.txt\necho \"vermagic_file=$VERMAGIC\" >> /tmp/kcfg/INFO.txt\necho \"official=$OFFI\" >> /tmp/kcfg/INFO.txt\ncat /tmp/kcfg/INFO.txt"
    - name: 上传官方内核配置
      uses: actions/upload-artifact@v4
      with:
        name: official-kernel-config
        path: /tmp/kcfg/
        retention-days: 90
    if: inputs.use_committed_config != 'true'
  build:
    name: 阶段B：单设备（只编 rax3000m）+ 钉入官方内核配置 → 官方 kmod 可直装
    needs:
    - seed
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
    - *id001
    - *id002
    - name: 安装编译依赖
      run: "sudo apt-get update -qq\nsudo apt-get install -y --no-install-recommends \\\n  ack antlr3 asciidoc autoconf automake autopoint binutils bison \\\n  build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler \\\n  fastjar flex gawk gcc-multilib g++-multilib git gnutls-dev gperf \\\n  haveged help2man intltool libncurses-dev libelf-dev libglib2.0-dev \\\n  libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libreadline-dev \\\n  libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz nano \\\n  ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip \\\n  python3-ply python3-docutils python3-pyelftools qemu-utils \\\n  re2c rsync scons squashfs-tools subversion swig texinfo \\\n  uglifyjs unzip vim wget xmlto xxd zlib1g-dev zstd\nsudo timedatectl set-timezone \"$TZ\"\necho \"nproc=$(nproc)\""
    - name: 恢复构建缓存（重跑可续）
      uses: actions/cache@v4
      with:
        path: 'openwrt/staging_dir

          openwrt/build_dir

          openwrt/bin'
        key: owrt-pinned-${{ inputs.release_tag }}-g1
        restore-keys: owrt-pinned-${{ inputs.release_tag }}-
    - name: 克隆 tag（官方 config 为底，随后收敛为单设备）
      run: "TAG=\"${{ inputs.release_tag }}\"; VER=\"${TAG#v}\"\n# 缓存恢复会在 workspace 里预建 openwrt/ 目录 → git clone 会因“目标非空”失败(exit 128)，先把它挪开\nif [ -e openwrt ]; then\n  rm -rf openwrt.keep; mkdir -p openwrt.keep\n  for d in staging_dir build_dir bin; do\n    if [ -d \"openwrt/$d\" ]; then mv \"openwrt/$d\" \"openwrt.keep/$d\"; fi\n  done\n  rm -rf openwrt\nfi\ngit clone $REPO_URL -b \"$TAG\" --single-branch --depth 1 openwrt\n# 把缓存里的构建产物并回新 clone 的源码树，保留“重跑可续”\nif [ -d openwrt.keep ]; then\n  for d in staging_dir build_dir bin; do\n    if [ -d \"openwrt.keep/$d\" ]; then mv \"openwrt.keep/$d\" \"openwrt/$d\"; fi\n  done\n  rm -rf openwrt.keep\nfi\ncd openwrt\ncurl -fsSL -o .config \"https://downloads.immortalwrt.org/releases/${VER}/targets/mediatek/filogic/config.buildinfo\"\n# ---- 收敛为单台设备（只编 cmcc_rax3000m）----\nsed -i 's/^CONFIG_TARGET_ALL_PROFILES=y/# CONFIG_TARGET_ALL_PROFILES is not set/' .config || true\n{\n  echo '# CONFIG_TARGET_ALL_PROFILES is not set'\n  echo 'CONFIG_TARGET_PROFILE=\"DEVICE_cmcc_rax3000m\"'\n  echo 'CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m=y'\n} >> .config\nif [ -f $GITHUB_WORKSPACE/diy-part1.sh ]; then chmod +x $GITHUB_WORKSPACE/diy-part1.sh; $GITHUB_WORKSPACE/diy-part1.sh; fi\n./scripts/feeds update -a\n./scripts/feeds install -a\nif [ -f $GITHUB_WORKSPACE/diy-part2.sh ]; then chmod +x $GITHUB_WORKSPACE/diy-part2.sh; $GITHUB_WORKSPACE/diy-part2.sh; fi\ngrep -q 'reg = <0x580000 0xFA80000>;' target/linux/mediatek/dts/mt7981b-cmcc-rax3000m-nand.dtso || { echo \"ERROR: DTS 未改\"; exit 1; }\nmake defconfig\necho \"=== 单设备确认 ===\"\ngrep -E '^CONFIG_TARGET_(ALL_PROFILES|PROFILE)|DEVICE_cmcc_rax3000m=y' .config\necho \"=== image packages (=y): $(grep -c '^CONFIG_PACKAGE_.*=y$' .config || true) ===\"\nmake download -j$(nproc) 2>&1 | tail -3"
    - name: 编 tools + toolchain
      run: 'cd openwrt

        make -j$(nproc) tools/compile toolchain/compile 2>&1 | tail -5

        # 先让它生成自己的（单设备）内核配置，随后被官方配置覆盖

        timeout 2400 make -j$(nproc) target/linux/prepare V=s 2>&1 | tail -20 || true

        LINDIR=$(ls -d build_dir/target-*/linux-mediatek_filogic/linux-6.12.* 2>/dev/null | head -1)

        echo "LINUX_DIR=$LINDIR"

        echo "$LINDIR" > /tmp/lindir.txt

        ls -d $LINDIR/*.configured* $LINDIR/.config $LINDIR/.config.set 2>/dev/null || true'
    - name: 下载官方内核配置并钉入
      uses: actions/download-artifact@v4
      with:
        name: official-kernel-config
        path: /tmp/kcfg
      if: inputs.use_committed_config != 'true'
    - name: 覆盖单设备内核配置为官方内核配置（关键步骤）
      run: 'cd openwrt

        LINDIR=$(cat /tmp/lindir.txt)

        echo "LINUX_DIR=$LINDIR"

        KC=/tmp/kcfg

        if [ ! -f "$KC/kernel.config.set" ]; then KC="$GITHUB_WORKSPACE/official-kernel-config"; fi

        echo "=== 使用的官方内核配置来源: $KC ==="

        ls -l "$KC"/

        (grep ''=[ym]'' "$KC/kernel.config.set" | LC_ALL=C sort | md5sum | cut -d'' '' -f1) || true

        cp -f "$KC"/kernel.config.set "$LINDIR/.config.set"

        cp -f "$KC"/kernel.config     "$LINDIR/.config"

        cp -f "$KC"/kernel.config     "$LINDIR/.config.prev"

        cp -f "$KC"/vermagic          "$LINDIR/.vermagic"

        # 让 make 认为「已配置」，不再重新合并内核配置

        touch "$LINDIR/.configured"* "$LINDIR/.prepared"* 2>/dev/null || true

        touch "$LINDIR/.config" "$LINDIR/.config.set" "$LINDIR/.vermagic"

        echo "=== 钉入后的内核 hash ==="

        grep ''=[ym]'' "$LINDIR/.config.set" | LC_ALL=C sort | md5sum | cut -d'' '' -f1

        cat "$LINDIR/.vermagic"; echo

        echo "(期望与官方 ${{ inputs.expected_khash }} 相同)" '
    - name: 编译（单设备，预计 1.5-3 小时）
      run: 'cd openwrt

        echo "======== 开始编译 ========"; date -u

        timeout 16000 make -j$(nproc) || { echo "=== 到点或失败，V=s 再试 ==="; timeout 3000 make -j$(nproc) V=s; }

        date -u

        LINDIR=$(cat /tmp/lindir.txt)

        echo "=== 编译后内核配置 hash（必须仍等于官方）==="

        grep ''=[ym]'' "$LINDIR/.config.set" | LC_ALL=C sort | md5sum | cut -d'' '' -f1

        cat "$LINDIR/.vermagic"; echo

        ls -lh bin/targets/mediatek/filogic/*cmcc_rax3000m*.itb 2>/dev/null || echo "（没出 itb）" '
    - name: 保存构建缓存
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: 'openwrt/staging_dir

          openwrt/build_dir

          openwrt/bin'
        key: owrt-pinned-${{ inputs.release_tag }}-g2-${{ github.run_id }}
    - name: 校验（布局 + 我们的 kernel 包 hash vs 官方）
      run: "cd openwrt\nITB=$(ls bin/targets/mediatek/filogic/*cmcc_rax3000m-squashfs-sysupgrade.itb | head -1)\necho \"ITB = $ITB\"\npython3 -c \"\nb=open('$ITB','rb').read()\nok=bytes.fromhex('005800000fa80000') in b\nbad=bytes.fromhex('0058000007200000') in b\nprint('=== layout probe: ubi=250.5M', ok, '| 114M', bad, '===')\nraise SystemExit(0 if (ok and not bad) else 1)\n\"\necho \"=== 我们编出的 kernel 包 ===\"\nls -1 bin/targets/mediatek/filogic/packages/ | grep -iE '^kernel' | head -5\nOURS=$(ls -1 bin/targets/mediatek/filogic/packages/ | grep -oiE '[0-9a-f]{32}' | sort -u | head -1)\nOFFI=\"${{ inputs.expected_khash }}\"\necho \"ours=${OURS:-none} official=${OFFI}\"\nif [ \"$OURS\" = \"$OFFI\" ]; then\n  echo \"=== kmod hash probe: MATCH ($OURS) -> 官方 release 的 kmod 可直接 apk add ✅ ===\"\n  echo \"kmod_compat=MATCH\" >> \"$GITHUB_WORKSPACE/kmod_probe.txt\"\nelse\n  echo \"=== kmod hash probe: MISMATCH ours=${OURS:-none} official=${OFFI} ===\"\n  echo \"kmod_compat=MISMATCH(ours=${OURS:-none},official=${OFFI})\" >> \"$GITHUB_WORKSPACE/kmod_probe.txt\"\nfi\necho \"=== kmod 包数量（应为官方 kmods 目录可补的形态）===\"\nls -1 bin/targets/mediatek/filogic/packages/ | grep -c '^kmod-' || true"
    - name: 打包离线包仓库（稳妥起见）
      run: 'cd openwrt

        rm -rf /tmp/offline && mkdir -p /tmp/offline/packages /tmp/offline/target-packages 2>/dev/null || true

        cp -a bin/packages/. /tmp/offline/packages/ 2>/dev/null || true

        [ -d bin/targets/mediatek/filogic/packages ] && cp -a bin/targets/mediatek/filogic/packages/. /tmp/offline/target-packages/ 2>/dev/null

        echo "userspace apk: $(find /tmp/offline/packages -name ''*.apk'' | wc -l)"

        echo "kmod/target apk: $(find /tmp/offline/target-packages -name ''*.apk'' | wc -l)"

        tar -czf rax3000m-256m-offline-packages.tar.gz -C /tmp/offline . 2>/dev/null; ls -lh rax3000m-256m-offline-packages.tar.gz || true'
    - name: 整理产物
      run: "mkdir -p firmware\nfind openwrt/bin/targets/mediatek/filogic -maxdepth 1 -type f \\\n  \\( -name '*cmcc_rax3000m*.itb' -o -name '*cmcc_rax3000m*.fip' -o -name '*cmcc_rax3000m*preloader*.bin' -o -name '*cmcc_rax3000m*.manifest' -o -name 'version.buildinfo' -o -name 'profiles.json' \\) \\\n  -exec cp {} firmware/ \\;\ncp -f openwrt/rax3000m-256m-offline-packages.tar.gz firmware/ 2>/dev/null || true\ncp -f $GITHUB_WORKSPACE/kmod_probe.txt firmware/kmod_probe.txt 2>/dev/null || true\nSRC_KCFG=/tmp/kcfg; [ -d \"$SRC_KCFG\" ] || SRC_KCFG=\"$GITHUB_WORKSPACE/official-kernel-config\"; mkdir -p firmware/official-kernel-config && cp -f \"$SRC_KCFG\"/* firmware/official-kernel-config/ 2>/dev/null || true\nls -lh firmware/\ncd firmware\nfind . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > sha256sums   # 只对文件算，目录会报错\ncat sha256sums\nls -1 official-kernel-config/ 2>/dev/null || true"
    - name: 上传 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rax3000m-256m-official-pinned
        path: firmware/
        retention-days: 90
    - name: 发布 Release
      if: ${{ inputs.make_release == 'true' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -e\ncd firmware\nVER=\"${{ inputs.release_tag }}\"; VER=\"${VER#v}\"\nTAG=\"rax3000m-256m-immortalwrt-${VER}-official-lean-$(date -u +%Y%m%d-%H%M)\"\nITB=$(ls *cmcc_rax3000m-squashfs-sysupgrade.itb | head -1)\nPROBE=$(cat kmod_probe.txt 2>/dev/null || echo \"kmod_compat=UNKNOWN\")\n{\n  echo \"## RAX3000M NAND 256M · ImmortalWrt **${VER}**「官方内核 + 单设备精简包」\"\n  echo\n  echo \"做法：\\`.config\\` 用官方 config 生成过一次**官方内核配置**（hash 复现校验通过），\"\n  echo \"然后**只编 rax3000m 一台设备**，并把内核配置钉成官方那份 →\"\n  echo \"**官方 release 源的 kmod-\\* 可直接 apk add**，同时固件比官方版更精简。\"\n  echo\n  echo \"| 项 | 值 |\"\n  echo \"|---|---|\"\n  echo \"| 源码 | immortalwrt @ tag **${{ inputs.release_tag }}**（feeds 按 commit 锁定）|\"\n  echo \"| 内核配置 | 官方 config 复现（md5 = \\`${{ inputs.expected_khash }}\\`）|\"\n  echo \"| 设备 | **只编 \\`cmcc_rax3000m\\`**（单设备，不是全 subtarget）|\"\n  echo \"| 唯一源码改动 | ubi 114M → **250.5MB** |\"\n  echo \"| 版本 | \\`${VER}\\` |\"\n  echo \"| apk 源 | releases/${VER}（用户态 + kmod 均可用）|\"\n  echo \"| 兼容自检 | \\`$PROBE\\` |\"\n  echo \"| 固件 | \\`$ITB\\` |\"\n  echo\n  echo \"### 附件\"\n  echo \"- \\`*.itb\\` 固件；\\`*.manifest\\` 包清单；\\`sha256sums\\`\"\n  echo \"- \\`official-kernel-config.tar.gz\\`：本版实际使用的内核配置 / .vermagic / 校验信息（可复现）\"\n  echo \"- \\`kmod_probe.txt\\`：官方 kmod 兼容性自检结果\"\n  echo \"- \\`rax3000m-256m-offline-packages.tar.gz\\`：离线包仓库（官方源不可达时兜底）\"\n  echo\n  echo \"### 刷入\"\n  echo \"1. \\`nanddump -f /tmp/factory.bin /dev/mtd2\\` 备份\"\n  echo \"2. 250.5MB 布局下系统内 sysupgrade 上传 \\`.itb\\`，**别勾保留配置**\"\n} > \"$GITHUB_WORKSPACE/NOTES.md\"\ncat \"$GITHUB_WORKSPACE/NOTES.md\"\nif [ -d official-kernel-config ]; then tar -czf official-kernel-config.tar.gz official-kernel-config; fi\nmapfile -d '' -t ASSETS < <(find . -maxdepth 1 -type f -print0 | sort -z)\ngh release create \"$TAG\" --repo \"$GITHUB_REPOSITORY\" --title \"RAX3000M 256M · ImmortalWrt ${VER}（官方内核+单设备精简 · 官方 kmod 可直装）\" --notes-file \"$GITHUB_WORKSPACE/NOTES.md\" \"${ASSETS[@]}\""
    if: always() && !cancelled()
